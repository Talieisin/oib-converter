name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Exact version, not a moving major tag: astral-sh/setup-uv stopped
      # publishing moving major tags after v7. Dependabot keeps this pin current.
      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install Python
        run: uv python install 3.12

      # Installs the locked dev group (ruff, mypy, type stubs) so CI checks
      # the same tool versions `just lint` uses locally.
      - name: Sync dependencies
        run: uv sync --locked

      - name: Run ruff
        run: uv run ruff check src/

      - name: Run mypy
        run: uv run mypy src/

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify CLI works
        run: oib-converter --help
